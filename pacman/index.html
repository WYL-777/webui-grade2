<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAC-MAN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <div class="wrapper">
    <header>
      <div class="logo">PAC<span>·</span>MAN</div>
      <div class="stats">
        <div class="stat-block">
          <span class="stat-label">SCORE</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">HIGH SCORE</span>
          <span class="stat-value" id="high-score">0</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">LIVES</span>
          <span class="stat-value" id="lives">&#9679; &#9679; &#9679;</span>
        </div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <div id="control-panel" style="margin-bottom: 10px; display: flex; justify-content: center; gap: 10px; font-family: 'Press Start 2P', monospace; font-size: 10px;">
        <label style="color: #6677aa; cursor: pointer;">
          <input type="checkbox" id="mode-toggle" checked style="cursor: pointer; accent-color: #FFE000;"> WEBCAM AI MODE
        </label>
      </div>
      
      <canvas id="game-canvas"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-box">
          <div class="overlay-title" id="overlay-title">PAC·MAN</div>
          <div class="overlay-sub" id="overlay-sub">Press SPACE or tap to start</div>
          <button class="start-btn" id="start-btn">START GAME</button>
        </div>
      </div>
    </div>

    <div class="controls-hint">
      <span>↑ ↓ ← →  or  WASD  to move</span>
      <span>SPACE to pause</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
